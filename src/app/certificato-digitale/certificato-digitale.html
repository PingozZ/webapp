<div class="register-container">

  <h2 *ngIf="step === 1">Crea il tuo account</h2>
  <h2 *ngIf="step === 2">Inserisci il codice ricevuto</h2>

  <!-- Messaggio di errore generale -->
  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <!-- STEP 1: FORM -->
  <form *ngIf="step === 1" [formGroup]="form" (ngSubmit)="submit()">

    <div class="form-group">
      <label>Nome</label>
      <input type="text" formControlName="name" />
      <small *ngIf="form.get('name')?.invalid && form.get('name')?.touched">
        Nome richiesto (min. 2 caratteri)
      </small>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" formControlName="email" />
      <small *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
        Email non valida
      </small>
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" formControlName="password" />
      <small *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
        Password richiesta (min. 8 caratteri)
      </small>
    </div>

    <div class="form-group">
      <label>Conferma Password</label>
      <input type="password" formControlName="confirmPassword" />
    </div>

    <div class="form-group checkbox">
      <input type="checkbox" formControlName="terms" />
      <label>Accetto i termini e condizioni</label>
    </div>

    <button type="submit" [disabled]="form.invalid || loading">
      {{ loading ? 'Caricamento...' : 'Accedi' }}
    </button>

  </form>

  <!-- STEP 2: INSERIMENTO CODICE OTP -->
  <div *ngIf="step === 2">

    <p>Contatta l'amministratore dell'app per ricevere il codice.</p>

    <div class="form-group">
      <label>Codice OTP</label>
      <input type="text" [(ngModel)]="otpCode" maxlength="6" placeholder="Inserisci il codice a 6 cifre" />
    </div>

    <button (click)="verifyCode()" [disabled]="loading || !otpCode">
      {{ loading ? 'Verifica...' : 'Verifica codice' }}
    </button>

  </div>
